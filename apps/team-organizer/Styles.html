<style>
/* 팡팡 — 스마트 팀 편성기 */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0f0b;
  --bg2: #0f1a12;
  --surface: #152019;
  --surface2: #1c2d20;
  --border: #1e3022;
  --border2: #2a4030;
  --accent: #4dd469;
  --accent2: #2bb048;
  --text: #edf7ea;
  --text2: #7faa86;
  --text3: #3d5e42;
  --gold: #f5c542;
  --amber: #f09030;
  --blue: #5b9bd5;
  --coral: #e07060;
  --purple: #9b7fe8;
  --radius: 16px;
  --radius-sm: 10px;
}

html, body { height: 100%; }

body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--accent); text-decoration: none; }

/* ── 상단바 ── */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  background: rgba(10, 15, 11, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.brand span { color: var(--accent); }
.brand small {
  display: block; font-size: 11px; font-weight: 400;
  color: var(--text2); letter-spacing: 0;
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.sheet-link {
  font-size: 12px; color: var(--text2);
  border: 1px solid var(--border2); border-radius: 999px;
  padding: 6px 12px; white-space: nowrap;
}
.sheet-link:hover { color: var(--accent); border-color: var(--accent); }

/* ── 레이아웃 ── */
.layout {
  display: grid;
  grid-template-columns: 340px minmax(0, 1fr);
  gap: 18px;
  padding: 18px 20px 60px;
  max-width: 1500px;
  margin: 0 auto;
  align-items: start;
}
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; padding: 14px 12px 48px; }
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.sidebar { position: sticky; top: 74px; max-height: calc(100vh - 92px); overflow-y: auto; }
@media (max-width: 980px) { .sidebar { position: static; max-height: none; } }

.section + .section { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--border); }

/* 명단이 길어져 사이드바가 스크롤돼도 편성 버튼은 항상 보이게 */
.action-section {
  position: sticky; bottom: -16px;
  background: var(--surface);
  padding-bottom: 6px; margin-bottom: -6px;
  z-index: 3;
}
.section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; color: var(--text2);
  letter-spacing: 0.4px; margin-bottom: 10px; text-transform: uppercase;
}
.section-title .count {
  margin-left: auto; font-size: 11px; color: var(--text3);
  text-transform: none; letter-spacing: 0;
}

label.field { display: block; margin-bottom: 10px; }
label.field > span { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; }

input[type="text"], input[type="date"], select {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  outline: none;
}
input[type="text"]:focus, input[type="date"]:focus, select:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(77, 212, 105, 0.12);
}
select { appearance: none; background-image: none; }

/* ── 팀 수 스테퍼 ── */
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button {
  width: 38px; height: 38px; flex: none;
  border-radius: var(--radius-sm);
  background: var(--surface2); border: 1px solid var(--border2);
  font-size: 18px; font-weight: 700; color: var(--text);
}
.stepper button:hover { border-color: var(--accent); color: var(--accent); }
.stepper input {
  flex: 1; text-align: center; font-size: 18px; font-weight: 700;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); padding: 7px 0;
  -moz-appearance: textfield;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.quick-teams { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.quick-teams button {
  font-size: 12px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text2);
}
.quick-teams button:hover, .quick-teams button.on {
  border-color: var(--accent); color: var(--accent);
}

/* ── 토글 ── */
.toggle {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg2);
  cursor: pointer; user-select: none;
}
.toggle + .toggle { margin-top: 7px; }
.toggle:hover { border-color: var(--border2); }
.toggle.on { border-color: var(--accent); background: rgba(77, 212, 105, 0.07); }
.toggle.disabled { opacity: 0.4; }
.toggle input { display: none; }
.toggle .box {
  width: 18px; height: 18px; flex: none; margin-top: 2px;
  border-radius: 5px; border: 1.5px solid var(--border2);
  display: grid; place-items: center;
  font-size: 11px; color: var(--bg); font-weight: 900;
}
.toggle.on .box { background: var(--accent); border-color: var(--accent); }
.toggle .txt { font-size: 13px; font-weight: 500; }
.toggle .hint { display: block; font-size: 11px; color: var(--text3); font-weight: 400; }
.toggle.random.on { border-color: var(--purple); background: rgba(155, 127, 232, 0.09); }
.toggle.random.on .box { background: var(--purple); border-color: var(--purple); }

/* ── 명단 칩 ── */
.roster-tools { display: flex; gap: 6px; margin-bottom: 9px; flex-wrap: wrap; }
.mini-btn {
  font-size: 11.5px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface2); border: 1px solid var(--border2); color: var(--text2);
}
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 10px; border-radius: 999px;
  border: 1px solid var(--border2); background: var(--bg2);
  font-size: 12.5px; line-height: 1.2;
}
.chip .no { color: var(--text3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chip .tag { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--surface2); color: var(--text2); }
.chip.g남 { border-color: rgba(91, 155, 213, 0.4); }
.chip.g여 { border-color: rgba(224, 112, 96, 0.4); }
.chip.absent {
  opacity: 0.42; text-decoration: line-through;
  border-style: dashed; background: transparent;
}
.chip.selectable:hover { border-color: var(--accent); }
.chip.picked { border-color: var(--accent); background: rgba(77, 212, 105, 0.12); }

/* ── 조건 ── */
.rule-group + .rule-group { margin-top: 12px; }
.rule-list { display: flex; flex-direction: column; gap: 6px; margin-top: 7px; }
.rule {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 9px; border-radius: var(--radius-sm);
  background: var(--bg2); border: 1px solid var(--border);
  font-size: 12.5px;
}
.rule.together { border-left: 3px solid var(--accent); }
.rule.apart { border-left: 3px solid var(--coral); }
.rule .names { flex: 1; min-width: 0; word-break: keep-all; }
.rule .del {
  flex: none; width: 22px; height: 22px; border-radius: 6px;
  color: var(--text3); font-size: 14px; line-height: 1;
}
.rule .del:hover { background: rgba(224, 112, 96, 0.15); color: var(--coral); }
.empty-note { font-size: 12px; color: var(--text3); padding: 6px 2px; }

/* ── 버튼 ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 11px 16px; border-radius: var(--radius-sm);
  font-weight: 700; font-size: 14px;
  border: 1px solid var(--border2); background: var(--surface2); color: var(--text);
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #06210d; border: none; font-size: 15px; padding: 13px 16px;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-sm { padding: 8px 12px; font-size: 12.5px; font-weight: 500; }

/* ── 결과 ── */
.result-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.result-title { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
.result-title span { color: var(--accent); }
.result-meta { font-size: 12px; color: var(--text2); }

.stat-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
.stat {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 7px 12px; border-radius: 999px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 12px; color: var(--text2);
}
.stat b { font-size: 14px; color: var(--text); font-weight: 700; }

.warn {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 10px 12px; border-radius: var(--radius-sm);
  background: rgba(240, 144, 48, 0.1); border: 1px solid rgba(240, 144, 48, 0.35);
  color: #f6c893; font-size: 12.5px; margin-bottom: 12px;
}

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }

.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}
.team-card {
  background: var(--surface); border: 1px solid var(--border);
  border-top: 3px solid var(--team-color, var(--accent));
  border-radius: var(--radius); padding: 13px 14px;
}
.team-card h3 {
  display: flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700; margin-bottom: 10px;
}
.team-card h3 .dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--team-color, var(--accent)); flex: none;
}
.team-card h3 .size {
  margin-left: auto; font-size: 11.5px; font-weight: 500;
  color: var(--text2); background: var(--bg2);
  border-radius: 999px; padding: 2px 9px;
}
.member-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 11px; }
.member {
  display: flex; align-items: center; gap: 7px;
  padding: 4px 6px; border-radius: 7px; font-size: 13.5px;
}
.member:nth-child(odd) { background: rgba(255, 255, 255, 0.022); }
.member .no {
  width: 24px; flex: none; text-align: right;
  color: var(--text3); font-size: 11.5px; font-variant-numeric: tabular-nums;
}
.member .nm { font-weight: 500; }
.member .badges { margin-left: auto; display: flex; gap: 4px; }
.badge {
  font-size: 10px; padding: 1px 5px; border-radius: 4px;
  background: var(--surface2); color: var(--text2); line-height: 1.6;
}
.badge.남 { background: rgba(91, 155, 213, 0.18); color: #9dc7ec; }
.badge.여 { background: rgba(224, 112, 96, 0.18); color: #f0a99e; }
.badge.상 { background: rgba(245, 197, 66, 0.18); color: var(--gold); }
.badge.중 { background: rgba(127, 170, 134, 0.16); color: var(--text2); }
.badge.하 { background: rgba(155, 127, 232, 0.16); color: #c0aef2; }

.team-foot {
  display: flex; flex-wrap: wrap; gap: 5px;
  padding-top: 9px; border-top: 1px dashed var(--border2);
  font-size: 11px; color: var(--text2);
}
.team-foot span {
  background: var(--bg2); border-radius: 5px; padding: 2px 7px;
}

.placeholder {
  text-align: center; padding: 60px 20px; color: var(--text3);
}
.placeholder .big { font-size: 40px; margin-bottom: 12px; }
.placeholder h2 { font-size: 17px; color: var(--text2); font-weight: 700; margin-bottom: 6px; }
.placeholder p { font-size: 13px; }

/* ── 최근 이력 ── */
.history-list { display: flex; flex-direction: column; gap: 6px; }
.history-item {
  display: flex; gap: 10px; align-items: center;
  font-size: 12.5px; color: var(--text2);
  padding: 8px 10px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.history-item b { color: var(--text); font-weight: 500; }
.history-item .when { margin-left: auto; color: var(--text3); font-size: 11.5px; }

/* ── 모달 ── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(4, 8, 5, 0.78);
  display: none; align-items: center; justify-content: center; padding: 18px;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: min(560px, 100%); max-height: 86vh; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 18px;
}
.modal h2 { font-size: 17px; margin-bottom: 4px; }
.modal .sub { font-size: 12.5px; color: var(--text2); margin-bottom: 12px; }
.modal .body { overflow-y: auto; flex: 1; padding: 2px; }
.modal .foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

/* ── 크게 보기 ── */
.bigview {
  position: fixed; inset: 0; z-index: 95;
  background: var(--bg); display: none;
  flex-direction: column; padding: 20px 24px;
}
.bigview.open { display: flex; }
.bigview-head {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex: none;
}
.bigview-head h2 { font-size: clamp(20px, 3vw, 34px); font-weight: 700; }
.bigview-head .meta { font-size: 14px; color: var(--text2); }
.bigview-body {
  flex: 1; overflow: auto;
  display: grid; gap: 14px;
  grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr));
  align-content: start;
}
.big-team {
  background: var(--surface); border-radius: var(--radius);
  border-top: 4px solid var(--team-color, var(--accent));
  padding: 14px 16px; min-width: 0;
}
.big-team h3 {
  font-size: clamp(16px, 1.6vw, 24px); margin-bottom: 8px;
  display: flex; align-items: baseline; gap: 8px;
}
.big-team h3 small { font-size: 13px; color: var(--text2); font-weight: 400; margin-left: auto; }
.big-team ul { list-style: none; }
.big-team li {
  font-size: clamp(15px, 1.5vw, 26px); font-weight: 500;
  padding: 2px 0; word-break: keep-all;
}
.big-team li small { color: var(--text3); font-size: 0.6em; margin-right: 6px; }

/* ── 토스트 ── */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
  z-index: 120; padding: 11px 18px; border-radius: 999px;
  background: var(--surface2); border: 1px solid var(--border2);
  font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s;
  max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { border-color: var(--coral); color: #f3b3a9; }

.loading { display: inline-block; animation: pulse 1.1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

.hidden { display: none !important; }

/* ── 인쇄 ── */
@media print {
  @page { margin: 12mm; }
  body { background: #fff; color: #111; font-size: 12px; }
  .no-print, .topbar, .sidebar, .actions, .toast, .modal-backdrop, .bigview,
  #history-panel, #warnings { display: none !important; }
  .layout { display: block; padding: 0; max-width: none; }
  .panel { border: none; background: none; padding: 0; }

  /* 흑백 출력에서도 읽히도록 모든 글자를 진하게 */
  .result-title, .result-meta, .stat, .stat b, .team-card h3, .team-card h3 .size,
  .team-foot, .team-foot span, .member, .member .no, .member .nm, .badge {
    color: #111 !important;
  }
  .result-title { font-size: 17px; }
  .stat { border: 1px solid #ccc; background: none !important; padding: 4px 9px; }
  .team-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .team-card {
    background: none; border: 1px solid #bbb;
    break-inside: avoid; page-break-inside: avoid;
    padding: 9px 10px;
  }
  .team-card h3 .size { background: none !important; border: 1px solid #ddd; }
  .member { padding: 2px 4px; }
  .member:nth-child(odd) { background: none; }
  .badge { border: 1px solid #ddd; background: none !important; }
  .team-foot span { background: none !important; }
}
</style>
